# Сборка форка Feather. Повторяет release.yml автора, но без релиза:
# просто отдаёт .ipa артефактом, чтобы забрать руками.
# make iphoneos — только iOS: Mac Catalyst нам не нужен, а это половина времени.
name: Build fork

on:
  workflow_dispatch:
    inputs:
      installer_only:
        description: Build only Installer when the main IPA is already available
        type: boolean
        default: false

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: 'true'

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.3.0.app

      - name: Test installation links
        run: |
          swiftc Feather/Backend/Server/InstallationLinks.swift Tests/InstallationLinksTests.swift -o /tmp/feather-install-tests
          /tmp/feather-install-tests

      - name: Test partial IPA transfers
        run: |
          swiftc Feather/Backend/Server/PayloadCoverage.swift Tests/PayloadCoverageTests.swift -o /tmp/feather-range-tests
          /tmp/feather-range-tests

      - name: Test self-update release validation
        run: |
          swiftc Feather/Backend/Observable/AppBankRelease.swift Tests/AppBankReleaseTests.swift -o /tmp/feather-release-tests
          /tmp/feather-release-tests

      - name: Test Installer handoff
        run: |
          swiftc Feather/Backend/Server/InstallerHandoff.swift Tests/InstallerHandoffTests.swift -o /tmp/feather-handoff-tests
          /tmp/feather-handoff-tests

      - name: Test repository download URLs
        run: swift test --package-path AltSourceKit

      - name: Compile Feather
        if: ${{ !inputs.installer_only }}
        run: |
          agvtool new-version -all $(git rev-parse --short HEAD)
          make iphoneos

      - name: Upload ipa
        if: ${{ !inputs.installer_only }}
        uses: actions/upload-artifact@v4
        with:
          name: Feather-ipa
          path: packages/Feather.ipa
          if-no-files-found: error

      - name: Compile minimal Installer
        run: |
          test -f deps/server.crt || make deps
          command -v xcodegen || brew install xcodegen
          swift FeatherInstaller/make-icon.swift FeatherInstaller/Assets.xcassets/AppIcon.appiconset/Installer.png
          cd FeatherInstaller
          xcodegen generate
          xcodebuild -project FeatherInstaller.xcodeproj -scheme FeatherInstaller -configuration Release -destination 'generic/platform=iOS' -derivedDataPath /tmp/FeatherInstaller CODE_SIGNING_ALLOWED=NO CURRENT_PROJECT_VERSION=$(git rev-parse --short HEAD)
          mkdir -p /tmp/InstallerPackage/Payload
          cp -R /tmp/FeatherInstaller/Build/Products/Release-iphoneos/FeatherInstaller.app /tmp/InstallerPackage/Payload/
          cp ../deps/* /tmp/InstallerPackage/Payload/FeatherInstaller.app/
          codesign --force --sign - --timestamp=none /tmp/InstallerPackage/Payload/FeatherInstaller.app
          mkdir -p ../packages
          ditto -c -k --sequesterRsrc --keepParent /tmp/InstallerPackage/Payload ../packages/FeatherInstaller.ipa

      - name: Upload Installer
        uses: actions/upload-artifact@v4
        with:
          name: FeatherInstaller-ipa
          path: packages/FeatherInstaller.ipa
          if-no-files-found: error
